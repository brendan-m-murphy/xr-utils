[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xr-utils"
version = "0.1.0"
description = "Utilities for xarray including CDL parsing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "xarray",
  "numpy",
  "lark",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xr_utils.cdl" = ["grammar.lark"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
